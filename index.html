<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuelos BFS | México</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body class="w-screen h-screen bg-slate-50 flex flex-col md:flex-row items-center overflow-hidden">

    <section class="hidden md:block md:w-1/2 h-full relative">
        <img src="img/avion.png" class="w-full h-full object-cover shadow-2xl">
    </section>

    <div class="flex flex-col items-center justify-center w-full md:w-1/2 p-8 lg:p-16">
        
        <div class="w-full max-w-md p-8 rounded-3xl">
            <header class="text-center mb-8">
                <h2 class="text-3xl text-indigo-800 font-extrabold">Vuelos BFS</h2>
                <p class="text-slate-500 text-sm mt-2 font-semibold">Algoritmos de Búsqueda en Amplitud</p>
            </header>

            <div id="panel-ciudades" class="mb-8">
                <label class="text-xs font-bold text-slate-400 mb-2 block">Ciudades Disponibles:</label>
                <div id="lista-tags" class="flex flex-wrap gap-2 text-xs">
                </div>
            </div>

            <div class="space-y-5">
                <div class="flex flex-col gap-1.5">
                    <label for="origen" class="text-sm font-semibold text-slate-700 ml-1">Origen</label>
                    <div class="relative">
                        <i class="bi bi-geo-alt absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" id="origen" placeholder="Ciudad de salida" 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-700" autocomplete="off">
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="destino" class="text-sm font-semibold text-slate-700 ml-1">Destino</label>
                    <div class="relative">
                        <i class="bi bi-send absolute left-3 top-3 text-slate-400 text-sm"></i>
                        <input type="text" id="destino" placeholder="Ciudad de llegada" 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-700" autocomplete="off">
                    </div>
                </div>

                <button id="btnBuscar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">
                    <i class="bi bi-search"></i>
                    Buscar Ruta Óptima
                </button>
            </div>

            <div id="resultado" class="mt-8 min-h-[50px]">
                </div>
        </div>
    </div>

    <script src="js/app.js"></script>

</body>

</html>
